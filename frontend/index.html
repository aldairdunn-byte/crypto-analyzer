<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://assets.coingecko.com/coins/images/825/large/bnb-icon2_2x.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Crypto Analyzer Pro — Terminal Cuantitativo 2.0</title>
    <meta name="description" content="Plataforma de Trading Cuantitativo, Análisis Técnico en Vivo y Bots Grid / DCA con persistencia en Supabase." />
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#08090C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CryptoAnalyzer" />

    <!-- Google Fonts: Plus Jakarta Sans (UI) & JetBrains Mono (Numbers/Code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Early Error Trap for Stale Deploy Chunks -->
    <script>
      window.addEventListener('error', function(e) {
        if (e && e.target && (e.target.tagName === 'SCRIPT' || e.target.tagName === 'LINK')) {
          var key = 'early_chunk_reload_' + (window.location.pathname || '/');
          var last = sessionStorage.getItem(key);
          var now = Date.now();
          if (!last || now - parseInt(last, 10) > 8000) {
            sessionStorage.setItem(key, now.toString());
            window.location.reload();
          }
        }
      }, true);
    </script>
    <style>
      #app-splash-loader {
        position: fixed;
        inset: 0;
        background: #08090C;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        color: #F8FAFC;
        user-select: none;
      }
      .splash-glow {
        position: absolute;
        width: 280px;
        height: 280px;
        background: radial-gradient(circle, rgba(245, 158, 11, 0.12) 0%, rgba(8, 9, 12, 0) 70%);
        pointer-events: none;
      }
      .splash-card {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px 40px;
        background: rgba(14, 17, 24, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(12px);
      }
      .splash-logo {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        margin-bottom: 16px;
        box-shadow: 0 0 24px rgba(245, 158, 11, 0.25);
        animation: pulseLogo 2s ease-in-out infinite;
      }
      @keyframes pulseLogo {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.9; }
      }
      .splash-title {
        font-size: 16px;
        font-weight: 800;
        letter-spacing: -0.02em;
        margin-bottom: 6px;
        background: linear-gradient(135deg, #FFFFFF 0%, #CBD5E1 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .splash-sub {
        font-size: 11px;
        color: #94A3B8;
        font-weight: 500;
        margin-bottom: 20px;
        letter-spacing: 0.02em;
      }
      .splash-bar {
        width: 140px;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 99px;
        overflow: hidden;
        position: relative;
      }
      .splash-progress {
        width: 45%;
        height: 100%;
        background: linear-gradient(90deg, #F59E0B, #0ECB81);
        border-radius: 99px;
        position: absolute;
        animation: splashSlide 1.5s ease-in-out infinite;
      }
      @keyframes splashSlide {
        0% { left: -45%; }
        100% { left: 100%; }
      }
    </style>
  </head>
  <body class="bg-[#08090C] text-[#F8FAFC] font-sans antialiased selection:bg-[#F59E0B]/30 selection:text-white">
    <div id="root">
      <div id="app-splash-loader">
        <div class="splash-glow"></div>
        <div class="splash-card">
          <img src="https://assets.coingecko.com/coins/images/825/large/bnb-icon2_2x.png" alt="Crypto Analyzer Pro" class="splash-logo" />
          <div class="splash-title">CRYPTO ANALYZER PRO</div>
          <div class="splash-sub">Iniciando Terminal Cuantitativo...</div>
          <div class="splash-bar">
            <div class="splash-progress"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
